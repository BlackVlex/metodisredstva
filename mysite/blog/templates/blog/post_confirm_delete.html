{% extends "blog/base.html" %}

{% block title %}Удаление поста{% endblock %}

{% block content %}
<h2>Удаление поста</h2>
<p>Вы уверены, что хотите удалить пост:</p>
<h3>"{{ post.title }}"</h3>

<form method="post">
    {% csrf_token %}
    <button type="submit" style="background-color: red; color: white; padding: 10px; border: none; cursor: pointer;">Да, удалить</button>
    <a href="{% url 'post_detail' pk=post.pk %}" style="margin-left: 15px;">Отмена</a>
</form>
{% endblock %}
